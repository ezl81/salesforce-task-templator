<template>
    <section class="slds-card">
        <header class="slds-theme_shade slds-p-around_medium slds-m-bottom_small">
            <div>
                <div class="slds-grid slds-grid_align-spread slds-p-bottom_x-small">
                    <h2 class="slds-welcome-mat__info-title">
                        Welcome to Task Tracker for Lightning Objects!
                    </h2>
                    <!--
                    <span >
                        <strong>50% Complete</strong>
                    </span>
                    -->
                </div>
                <div class="slds-grid slds-grid_align-spread slds-p-bottom_x-small">
                    <h3>Easy as 1, 2, 3!</h3>
                </div>

                <!--
                <div class="slds-progress-bar slds-progress-bar_circular" aria-valuemin="0" aria-valuemax="100"
                    aria-valuenow="50" aria-labelledby="progress-bar-label-id-1"
                    aria-label="Placeholder for description of progress bar" role="progressbar">
                    <span class="slds-progress-bar__value" style="width:50%">
                        <span class="slds-assistive-text">Progress: 50%</span>
                    </span>
                </div>
            -->
            </div>
        </header>

        <ol class="slds-setup-assistant">

            <!--Setup Case and Task Statuses-->

            <li class="slds-setup-assistant__item">
                <article class="slds-setup-assistant__step">
                    <div class="slds-summary-detail slds-is-open" lwc:ref="toggleStatusArrow">
                        <button class="slds-button slds-button_icon slds-m-right_x-small slds-m-top_x-small"
                            title="Toggle details for Turn On Tracking for Profiles"
                            aria-controls="step-2-setup-cases-tasks" aria-expanded="true">
                            <!--icon-name={statusIcon}-->
                            <lightning-button-icon 
                                icon-name={statusIcon}
                                onclick={onClickToggleStatues}
                                alternative-text="Toggle details setup cases and steps." 
                                size="small"
                                aria-controls="step-1-setup-cases-tasks" 
                                variant="bare">
                            </lightning-button-icon>
                            <!--
                            <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
                                class="slds-button__icon slds-summary-detail__action-icon" >
                                <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#switch"></use>
                            </svg>
                        -->
                            <span class="slds-assistive-text">Toggle details for Case and Task Statues</span>
                        </button>
                        <div class="slds-container_fluid">
                            <div class="slds-summary-detail__title">
                                <div class="slds-setup-assistant__step-summary">
                                    <div class="slds-media">
                                        <div class="slds-media__figure">
                                            <div class="slds-progress-ring slds-progress-ring_large">
                                                <div class="slds-progress-ring__progress" role="progressbar"
                                                    aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
                                                    aria-label="">
                                                    <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
                                                        viewBox="-1 -1 2 2">
                                                        <path class="slds-progress-ring__path"
                                                            d="M 1 0 A 1 1 0 0 0 1.00 -0.00 L 0 0"></path>
                                                    </svg>
                                                </div>
                                                <div class="slds-progress-ring__content">1</div>
                                            </div>
                                        </div>
                                        <div class="slds-media__body slds-m-top_x-small">
                                            <div class="slds-media">
                                                <div
                                                    class="slds-setup-assistant__step-summary-content slds-media__body">
                                                    <h3
                                                        class="slds-setup-assistant__step-summary-title slds-text-heading_small">
                                                        <button class="slds-button slds-button_reset"
                                                            onclick={onClickToggleStatues}
                                                        aria-controls="step-1-setup-cases-tasks" >
                                                            Setup Case and Task Statuses
                                                        </button>
                                                    </h3>
                                                    <p>
                                                        Statuses help determine where the case/task is in the
                                                        process. Clicking here will take you to the metadata needed
                                                        to set these up.
                                                        Generally, Salesforce out of the box will not require these to
                                                        be modified, but if you need to you can do so.
                                                    </p>
                                                </div>
                                                <div class="slds-media__figure slds-media__figure_reverse">
                                                    <a class="slds-button slds-button_neutral"
                                                        target="_blank"
                                                        href="/lightning/setup/CustomMetadata/page?address=%2Fm00%3Fsetupid%3DCustomMetadata">Setup
                                                        Metadata</a>
                                                    <p class="slds-text-align_right slds-text-color_weak">5 min</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-summary-detail__content hidden" lwc:ref="setupCaseTaskDetails">
                                <div class="slds-setup-assistant__step-detail">
                                    <div class="slds-progress slds-progress_vertical slds-progress_success">
                                        <ol class="slds-progress__list slds-progress__list-bordered">
                                            <li class="slds-progress__item">
                                                <div class="slds-progress__marker">
                                                    <span class="slds-assistive-text">Active</span>
                                                </div>
                                                <div class="slds-progress__item_content slds-grid slds-grid_align-spread">
                                                    <div class="slds-size_3-of-4">
                                                        Case statuses
                                                    </div>
                                                    <div class="slds-grid slds-grid_align-end slds-size_1-of-4">
                                                            <a href="/lightning/setup/ObjectManager/Case/FieldsAndRelationships/Status/view" target="_blank">
                                                                View Case Statuses
                                                            </a>
                                                    </div>
                                                </div>
                                            </li>
                                            <li class="slds-progress__item">
                                                <div class="slds-progress__marker">
                                                    <span class="slds-assistive-text">Active</span>
                                                </div>
                                                <div
                                                    class="slds-progress__item_content slds-grid slds-grid_align-spread">
                                                    <div class="slds-size_3-of-4">
                                                        Task Statuses
                                                    </div>
                                                    <div class="slds-grid slds-grid_align-end slds-size_1-of-4">
                                                        <a href="/lightning/setup/ObjectManager/Task/FieldsAndRelationships/Status/view" target="_blank">
                                                            View Task Statuses
                                                        </a>
                                                    </div>
                                                </div>
                                            </li>
                                        </ol>
                                        <div aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"
                                            role="progressbar">
                                            <span class="slds-assistive-text">Progress: 50%</span>
                                        </div>
                                    </div>
                                    <div class="slds-scoped-notification slds-media slds-media_center slds-scoped-notification_light"
                                        role="status">
                                        <div class="slds-media__figure">
                                            <span class="slds-icon_container slds-icon-utility-info"
                                                title="information">
                                                <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
                                                    class="slds-icon slds-icon_small slds-icon-text-default">
                                                    <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#info">
                                                    </use>
                                                </svg>
                                                <span class="slds-assistive-text">information</span>
                                            </span>
                                        </div>
                                        <div class="slds-media__body">
                                            <p>
                                                <a href="https://www.youtube.com/watch?v=0pcUtbayzmU" target="_blank">Video</a> on setting up statuses
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </article>
            </li>

            <!--Decide/Setup Templates-->

            <li class="slds-setup-assistant__item">
                <article class="slds-setup-assistant__step">
                    <!-- slds-is-open-->

                    <div class="slds-summary-detail slds-is-open" lwc:ref="toggleCreateTemplates">
                        <!--
                        <button class="slds-button slds-button_icon slds-m-right_x-small slds-m-top_x-small"
                            title="Toggle details for Turn On Tracking for Profiles"
                            aria-controls="step-3-summary-action" aria-expanded="false" }>
                        -->
                            <lightning-button-icon 
                                icon-name={templateIcon}
                                onclick={onClickToggleCreateTemplates}
                                alternative-text="Toggle details for Create Templates" 
                                size="small"
                                variant="bare">
                            </lightning-button-icon>
                        <!--</button>-->

                        <div class="slds-container_fluid">
                            <div class="slds-summary-detail__title">
                                <div class="slds-setup-assistant__step-summary">
                                    <div class="slds-media">
                                        <div class="slds-media__figure">
                                            <div class="slds-progress-ring slds-progress-ring_large">
                                                <div class="slds-progress-ring__progress" role="progressbar"
                                                    aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
                                                    aria-label="">
                                                    <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
                                                        viewBox="-1 -1 2 2">
                                                        <path class="slds-progress-ring__path"
                                                            d="M 1 0 A 1 1 0 0 0 1.00 -0.00 L 0 0"></path>
                                                    </svg>
                                                </div>
                                                <div class="slds-progress-ring__content">2</div>
                                            </div>
                                        </div>
                                        <div class="slds-media__body slds-m-top_x-small">
                                            <div class="slds-media">
                                                <div
                                                    class="slds-setup-assistant__step-summary-content slds-media__body">
                                                    <h3
                                                        class="slds-setup-assistant__step-summary-title slds-text-heading_small">
                                                        <button class="slds-button slds-button_reset"
                                                            onclick={onClickToggleCreateTemplates}
                                                            aria-controls="step-1-summary-action" aria-expanded="true">
                                                            Create Templates
                                                        </button>
                                                    </h3>
                                                    <p>
                                                        Understand the objects that need to be included for the
                                                        templates and create the templates.
                                                        These will need to match values on the Status fields on the Task
                                                        and Case objects.
                                                    </p>
                                                </div>
                                                <div class="slds-media__figure slds-media__figure_reverse">

                                                    <a class="slds-button slds-button_neutral"
                                                        target="_blank"
                                                        href="/lightning/o/Task_Template__c/list?filterName=Parent_Templates">
                                                        Create
                                                        Templates
                                                    </a>

                                                    <p class="slds-text-align_right slds-text-color_weak">30 min</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-summary-detail__content hidden" lwc:ref="setupCreateTemplates">
                                <div class="slds-setup-assistant__step-detail">
                                    <div class="slds-progress slds-progress_vertical slds-progress_success">
                                        <ol class="slds-progress__list slds-progress__list-bordered">
                                            <li class="slds-progress__item slds-is-completed">
                                                <span
                                                    class="slds-icon_container slds-icon-utility-success slds-progress__marker slds-progress__marker_icon slds-progress__marker_icon-success"
                                                    title="Complete">
                                                    <svg class="slds-icon slds-icon_xx-small">
                                                        <use
                                                            xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#success">
                                                        </use>
                                                    </svg>
                                                    <span class="slds-assistive-text">Complete</span>
                                                </span>
                                                <div
                                                    class="slds-progress__item_content slds-grid slds-grid_align-spread">
                                                    <div class="slds-size_3-of-4">
                                                        <strong>Decide What Objects Use Templates.</strong> 
                                                        <p>
                                                            Decide what types of objects will be using task
                                                            templates. Some common uses are Accounts (for
                                                            onboarding customers)
                                                            and Contacts (for onboarding leads). Your
                                                            organization might use customer support tickets or
                                                            some other objects for
                                                            sales processes.
                                                        </p>
                                                    </div>
                    
                                                </div>
                                            </li>
                                            <li class="slds-progress__item">
                                                <div class="slds-scoped-notification slds-media slds-media_center slds-scoped-notification_light"
                                                    role="status">
                                                    <div class="slds-media__figure">
                                                        <span class="slds-icon_container slds-icon-utility-info"
                                                            title="information">
                                                            <svg class="slds-icon slds-icon_small slds-icon-text-default">
                                                                <use
                                                                    xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#info">
                                                                </use>
                                                            </svg>
                                                            <span class="slds-assistive-text">information</span>
                                                        </span>
                                                    </div>
                                                    <div class="slds-media__body">
                                                        <p>
                                                            <a href="https://www.youtube.com/watch?v=siw-mIYiJ7w" target="_blank">Video</a> on how to set up templates
                                                        </p>
                                                    </div>
                                                </div>
                                            </li>
                                        </ol>
                                        <div aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"
                                            role="progressbar">
                                            <span class="slds-assistive-text">Progress: 50%</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </article>
            </li>

            <li class="slds-setup-assistant__item">
                <article class="slds-setup-assistant__step">
                    <div class="slds-summary-detail slds-is-open" lwc:ref="toggleObjectSetup">
                        <button class="slds-button slds-button_icon slds-m-right_x-small slds-m-top_x-small"
                            title="Toggle details for Turn On Tracking for Profiles" aria-controls="step-3-setup-objects"
                            aria-expanded="true">
                            <!--icon-name={statusIcon}-->
                            <lightning-button-icon 
                                icon-name={objectLayoutIcon} 
                                onclick={onClickToggleObjectLayouts}
                                alternative-text="Toggle details setup cases and steps." size="small"
                                aria-controls="step-3-setup-objects" variant="bare">
                            </lightning-button-icon>
                            <span class="slds-assistive-text">Toggle Setup Objects</span>
                        </button>
                        <div class="slds-container_fluid">
                            <div class="slds-summary-detail__title">
                                <div class="slds-setup-assistant__step-summary">
                                    <div class="slds-media">
                                        <div class="slds-media__figure">
                                            <div class="slds-progress-ring slds-progress-ring_large">
                                                <div class="slds-progress-ring__progress" role="progressbar" aria-valuemin="0"
                                                    aria-valuemax="100" aria-valuenow="0" aria-label="">
                                                    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 2 2">
                                                        <path class="slds-progress-ring__path"
                                                            d="M 1 0 A 1 1 0 0 0 1.00 -0.00 L 0 0"></path>
                                                    </svg>
                                                </div>
                                                <div class="slds-progress-ring__content">3</div>
                                            </div>
                                        </div>
                                        <div class="slds-media__body slds-m-top_x-small">
                                            <div class="slds-media">
                                                <div class="slds-setup-assistant__step-summary-content slds-media__body">
                                                    <h3 class="slds-setup-assistant__step-summary-title slds-text-heading_small">
                                                        <button class="slds-button slds-button_reset" onclick={onClickToggleObjectLayouts}
                                                            aria-controls="step-3-setup-objects">
                                                            Setup Object Layouts
                                                        </button>
                                                    </h3>
                                                    <p>
                                                        Adding lightning components to the object pages allows users to see how the cases are progressing.
                                                    </p>
                                                </div>
                                                <div class="slds-media__figure slds-media__figure_reverse">
                                                    <!--
                                                    <a class="slds-button slds-button_neutral" target="_blank"
                                                        href="/lightning/setup/CustomMetadata/page?address=%2Fm00%3Fsetupid%3DCustomMetadata">
                                                        Setup
                                                        Metadata
                                                    </a>
                                                    -->
                                                    <p class="slds-text-align_right slds-text-color_weak">30 min</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="slds-summary-detail__content hidden" lwc:ref="setupObjectLayouts">
                                <div class="slds-setup-assistant__step-detail">
                                    <div class="slds-progress slds-progress_vertical slds-progress_success">
                                        <ol class="slds-progress__list slds-progress__list-bordered">

                                            <template for:each={objectList} for:item="obj">

                                                <li key={obj.id} class="slds-progress__item">
                                                    <div class="slds-progress__marker">
                                                        <span class="slds-assistive-text">Active</span>
                                                    </div>
                                                    <div class="slds-progress__item_content slds-grid slds-grid_align-spread">
                                                        <div class="slds-size_3-of-4">
                                                            Setup the record page for {obj.label} to layout the task template components.
                                                        </div>
                                                        <div class="slds-grid slds-grid_align-end slds-size_1-of-4">
                                                            <a target="_blank" href={obj.url}>
                                                                View {obj.label}
                                                            </a>
                                                        </div>
                                                    </div>
                                                </li>

                                            </template>

                                            <li class="slds-progress__item">
                                                <div class="slds-progress__marker">
                                                    <span class="slds-assistive-text">Active</span>
                                                </div>
                                                <div class="slds-progress__item_content slds-grid slds-grid_align-spread">
                                                    <div class="slds-size_3-of-4">
                                                        Setup the record page for custom objects to layout the task template components.
                                                    </div>
                                                    <div class="slds-grid slds-grid_align-end slds-size_1-of-4">
                                                        <a target="_blank" href="/lightning/setup/ObjectManager/home">
                                                            View Object Manager
                                                        </a>
                                                    </div>
                                                </div>
                                            </li>

                                        </ol>
                                        <div aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" role="progressbar">
                                            <span class="slds-assistive-text">Progress: 50%</span>
                                        </div>
                                    </div>
                                    <div class="slds-scoped-notification slds-media slds-media_center slds-scoped-notification_light" role="status">
                                        <div class="slds-media__figure">
                                            <span class="slds-icon_container slds-icon-utility-info" title="information">
                                                <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
                                                    class="slds-icon slds-icon_small slds-icon-text-default">
                                                    <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#info">
                                                    </use>
                                                </svg>
                                                <span class="slds-assistive-text">information</span>
                                            </span>
                                        </div>
                                        <div class="slds-media__body">
                                            <p>
                                                <a href="https://youtu.be/n6woR9aR-6w" target="_blank">Video</a> on setting up object layouts
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                                
                        </div>
                    </div>
                </article>
            </li>

            <!--END OF SET OBJECT LAYOUTS-->

            <li class="slds-setup-assistant__item">
                <article class="slds-setup-assistant__step">
                    <div class="slds-summary-detail slds-is-open" lwc:ref="toggleStatusArrow">
                        <button class="slds-button slds-button_icon slds-m-right_x-small slds-m-top_x-small"
                            title="Ask questions" aria-controls="step-4-ask-questions"
                            aria-expanded="true">
                            <span class="slds-assistive-text">Toggle details for Case and Task Statues</span>
                        </button>
                        <div class="slds-container_fluid">
                            <div class="slds-summary-detail__title">
                                <div class="slds-setup-assistant__step-summary">
                                    <div class="slds-media">
                                        <div class="slds-media__figure">
                                            <div class="slds-progress-ring slds-progress-ring_large">
                                                <div class="slds-progress-ring__progress" role="progressbar" aria-valuemin="0"
                                                    aria-valuemax="100" aria-valuenow="0" aria-label="">
                                                    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 2 2">
                                                        <path class="slds-progress-ring__path"
                                                            d="M 1 0 A 1 1 0 0 0 1.00 -0.00 L 0 0"></path>
                                                    </svg>
                                                </div>
                                                <div class="slds-progress-ring__content">4</div>
                                            </div>
                                        </div>
                                        <div class="slds-media__body slds-m-top_x-small">
                                            <div class="slds-media">
                                                <div class="slds-setup-assistant__step-summary-content slds-media__body">
                                                    <h3 class="slds-setup-assistant__step-summary-title slds-text-heading_small">
                                                        <button class="slds-button slds-button_reset"
                                                            aria-controls="step-4-ask-questions">
                                                            Ask Questions/Assistance
                                                        </button>
                                                    </h3>
                                                    <p>
                                                        Need more assistance?  Feel free to contact <a href="mailto:SimplyEzConsulting@gmail.com">SimplyEzConsulting@gmail.com</a> for questions or assistance.  We're here to help!
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </article>
            </li>

        </ol>
    </section>
</template>
